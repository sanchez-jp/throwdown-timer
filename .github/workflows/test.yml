name: Timer engine tests

on:
  push:
    branches: [main, initial-scaffold]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check src/app.js && node --check src/timer-engine.js && node --check src/timer-plan-builder.js && node --check service-worker.js
      - name: Run unit tests
        run: npm test
